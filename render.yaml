services:
  - type: web
    name: traffic-ai-service
    runtime: docker
    plan: free
    buildCommand: ""
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop"
    envVars:
      - key: DEVICE
        value: "cpu"
      - key: VEHICLE_MODEL_PATH
        value: "weights/vehicle_model.pt"
      - key: PLATE_MODEL_PATH
        value: "weights/plate_model.pt"
      - key: OCR_LANG
        value: "en"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
